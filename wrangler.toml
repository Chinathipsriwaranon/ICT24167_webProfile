name = "ict-student-portfolio"
compatibility_date = "2024-09-23"
pages_build_output_dir = "."

# Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "ict_portfolio_db"
database_id = "your-d1-database-id-here"

# Cloudflare R2 Storage Bucket Binding (for project images & certificate PDFs)
[[r2_buckets]]
binding = "STORAGE_BUCKET"
bucket_name = "ict-portfolio-storage"
